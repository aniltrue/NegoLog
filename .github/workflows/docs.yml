name: Documentation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build current API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs-source/requirements.txt
      - name: Install documentation environment
        run: python -m pip install -r requirements.txt -r docs-source/requirements.txt
      - name: Build
        run: python -m sphinx -W --keep-going -b html docs-source "${{ runner.temp }}/negolog-docs-html"
      - name: Upload documentation for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: negolog-api-documentation
          path: ${{ runner.temp }}/negolog-docs-html
          if-no-files-found: error
          retention-days: 7
